name: Gerar APK Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - run: rm -f package-lock.json && npm install
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add package-lock.json
          git commit -m "Sync package-lock.json" || true
          git push || true
      - run: npx eas-cli init --id 0d4d1f76-5801-4a03-9e9a-23b95b422a74 --non-interactive --force
      - run: npx eas-cli build -p android --profile preview --non-interactive --no-wait
      
